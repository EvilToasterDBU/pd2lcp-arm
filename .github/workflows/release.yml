name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-x86_64:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          tags: pd2lcp-builder
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release
        run: docker run --rm -v "$PWD:/build" pd2lcp-builder

      - name: Upload x86_64 release files
        uses: actions/upload-artifact@v4
        with:
          name: release-x86_64
          path: releases/*
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libvulkan-dev libxkbcommon-dev curl file appstream llvm clang libfuse2t64

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Set up Cargo AppImage
        run: |
          rustup default nightly
          cargo install cargo-appimage --locked

      - name: Install ARM64 appimagetool
        run: |
          sudo curl -L --fail --retry 3 -o /appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          sudo chmod +x /appimagetool
          sudo install -m 0755 appimagetool-wrapper.sh /usr/local/bin/appimagetool

      - name: Build ARM64 AppImage
        run: sh ./build_release_arm64.sh

      - name: Upload ARM64 release file
        uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: releases/*
          if-no-files-found: error

  publish:
    needs: [build-x86_64, build-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download x86_64 release files
        uses: actions/download-artifact@v4
        with:
          name: release-x86_64
          path: releases

      - name: Download ARM64 release file
        uses: actions/download-artifact@v4
        with:
          name: release-aarch64
          path: releases

      - name: Create checksums
        run: cd releases && sha256sum pd2lcp-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
